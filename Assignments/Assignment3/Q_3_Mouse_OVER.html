<!DOCTYPE html>
<html>
<body>

<img src="/Assignment3/AI.png"
onmouseover="over()"
onmouseout="out()">

<p id="t">Hover on image</p>

<script>
function over(){
document.getElementById("t").innerHTML="Mouse Over Image";
}
function out(){
document.getElementById("t").innerHTML="Mouse Out Image";
}
</script>

</body>
</html>
