<!DOCTYPE html>
<html>
<body>

<button onclick="run()">Run</button>
<pre id="o"></pre>

<script>
function run(){
let arr=["Amit","Ravi","Sita","Neha","John","Raj","Kiran","Pooja","Vikas","Anil"];

let out="Original: "+arr+"\n";

arr.sort();
out+="Sorted: "+arr+"\n";

arr.reverse();
out+="Reverse: "+arr+"\n";

arr.push("NewName");
out+="After Add: "+arr+"\n";

arr.pop();
out+="After Delete: "+arr;

document.getElementById("o").innerText=out;
}
</script>

</body>
</html>
