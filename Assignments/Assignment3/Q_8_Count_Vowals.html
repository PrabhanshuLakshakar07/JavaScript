<!DOCTYPE html>
<html>
<body>

<input id="v" placeholder="Enter text">
<button onclick="check()">Count</button>
<p id="o"></p>

<script>
function check(){
let s=document.getElementById("v").value.toLowerCase();
let count=0;
for(let ch of s){
if("aeiou".includes(ch)) count++;
}
document.getElementById("o").innerHTML="Vowels: "+count;
}
</script>

</body>
</html>
