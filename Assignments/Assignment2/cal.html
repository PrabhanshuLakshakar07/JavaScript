<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>

<style>
body{text-align:center;font-family:Arial;}
.box{border:2px solid #333;padding:20px;width:300px;margin:auto;}
button{margin:5px;padding:6px;}
</style>

<script>
function calc(op){
let n1 = parseFloat(document.getElementById("n1").value);
let n2 = parseFloat(document.getElementById("n2").value);
let res;

if(op==='+') res = n1 + n2;
else if(op==='-') res = n1 - n2;
else if(op==='*') res = n1 * n2;
else if(op==='/') res = n1 / n2;

document.getElementById("ans").innerHTML="Result: "+res;
}
</script>

</head>
<body style="background-color: rgb(153, 255, 243);">

<div class="box">
<h3>Calculator</h3>

<input type="number" id="n1" placeholder="Number 1"><br><br>
<input type="number" id="n2" placeholder="Number 2"><br><br>

<button onclick="calc('+')">ADD</button>
<button onclick="calc('-')">SUBTRACT</button>
<button onclick="calc('*')">MULTIPLY</button>
<button onclick="calc('/')">DIVIDE</button>

<p id="ans"></p>
</div>

</body>
</html>
