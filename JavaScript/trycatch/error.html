<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        
    var num = prompt("Enter a number >1000");
    function fun1(){
        try{
            if(num<10)
            throw("Err1");
            else if (num>1000)
            throw("Err2");
            else
            alert("valid number");

            

        }catch(er){
            if(er=="Err1"){
                alert("the number can not  be less than 10");

            }
            else if(er=="Err2"){
                alert("the number can not  be greater than 1000");
            }

        }

    }
    </script>


</head>
<body>
    <input type="button" value="check" onclick="fun1()">
    
</body>
</html>
