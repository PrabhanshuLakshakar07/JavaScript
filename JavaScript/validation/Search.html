<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        function check(){
            var fname=document.getElementById("fname").value;
            var txt1=fname.search(/shu/i); 
            //i: not case sentive
            //if i not present : case sensitive
            var t=document.getElementById("textarea1");
            t.value="";
            t.value=txt1; //2
            alert(txt1);
        
        }

    </script>

</head>
<body>
    Enter fname <input type="text" id="fname" /><br/>
    <input type="button" value="Click Here " onclick="check()"/> <br/>
    <br/>
    <textarea rows="4" cols="20" id="textarea1"></textarea>
    
</body>
</html>
