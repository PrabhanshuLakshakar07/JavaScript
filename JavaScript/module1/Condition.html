<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    var d=new Date();
    var h=d.getHours()
    if(h<12){
        document.writeln("Good Morning");

    }
    else if(h>=12 && h<16)
    {
        document.writeln("Good Afternoon");


    }else if(h>=16 && h<20)
    {
         document.writeln("Good Evening");
    }else {
         document.writeln("Good Night")
    }
  </script>
</head>
<body>
    
</body>
</html>
