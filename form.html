<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>

    <style>
        #ErrorFirst, #ErrorMiddle, #ErrorLast,
        #ErrorEno, #ErrorAge, #ErrorEmail, #ErrorPass {
            color: red;
        }
    </style>

    <script>

        function validateForm()
        {
            if(!fun1() || !fun2() || !fun3() || !fun5() || !fun6() || !fun7() || !fun4())
            {
                return false;
            }
            return true;
        }

        function fun1()
        {
            var fname = document.getElementById("txtFirst").value;
            if(fname == "")
            {
                document.getElementById("ErrorFirst").innerHTML = "Please enter First Name";
                return false;
            }
            document.getElementById("ErrorFirst").innerHTML = "";
            return true;
        }

        function fun2()
        {
            var mname = document.getElementById("txtMiddle").value;
            if(mname == "")
            {
                document.getElementById("ErrorMiddle").innerHTML = "Please enter Middle Name";
                return false;
            }
            document.getElementById("ErrorMiddle").innerHTML = "";
            return true;
        }

        function fun3()
        {
            var lname = document.getElementById("txtLast").value;
            if(lname == "")
            {
                document.getElementById("ErrorLast").innerHTML = "Please enter Last Name";
                return false;
            }
            document.getElementById("ErrorLast").innerHTML = "";
            return true;
        }

        function fun4()
        {
            var empNo = document.getElementById("txtEid").value;
            if(empNo == "")
            {
                document.getElementById("ErrorEno").innerHTML = "Please enter Employee ID";
                return false;
            }
            document.getElementById("ErrorEno").innerHTML = "";
            return true;
        }

        function fun5()
        {
            var age = document.getElementById("txtAge").value;

            if(age == "" || isNaN(age))
            {
                document.getElementById("ErrorAge").innerHTML = "Please enter valid age";
                return false;
            }
            else if(age < 18)
            {
                document.getElementById("ErrorAge").innerHTML = "You are not eligible for vote";
                return false;
            }
            else
            {
                document.getElementById("ErrorAge").innerHTML = "You are eligible for vote";
                return true;
            }
        }

        function fun6()
        {
            var email = document.getElementById("txtEmail").value;
            var pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if(!pattern.test(email))
            {
                document.getElementById("ErrorEmail").innerHTML = "Please enter valid email";
                return false;
            }
            document.getElementById("ErrorEmail").innerHTML = "";
            return true;
        }

        function fun7()
        {
            var pass = document.getElementById("txtPassword").value;

            if(pass == "")
            {
                document.getElementById("ErrorPass").innerHTML = "Please enter password";
                return false;
            }
            else if(pass.length < 6)
            {
                document.getElementById("ErrorPass").innerHTML = "Password must be at least 6 characters";
                return false;
            }

            document.getElementById("ErrorPass").innerHTML = "";
            return true;
        }

    </script>
</head>

<body style="align-content: center; height: 250; width: 300;">

<form onsubmit="return validateForm()" style="align-content: center; height: 250; width: 300;" >
    <table style=" padding-left: 20; box-shadow: 100;  background-color: rgb(148,251,237); height: 500px; width: 600px;  border-radius:20px; padding:10px; align-items: center;">
        
        <tr>
            <td>First Name:</td>
            <td><input type="text" id="txtFirst" onblur="fun1()"></td>
            <td><div id="ErrorFirst"></div></td>
        </tr>

        <tr>
            <td>Middle Name:</td>
            <td><input type="text" id="txtMiddle" onblur="fun2()"></td>
            <td><div id="ErrorMiddle"></div></td>
        </tr>

        <tr>
            <td>Last Name:</td>
            <td><input type="text" id="txtLast" onblur="fun3()"></td>
            <td><div id="ErrorLast"></div></td>
        </tr>

        <tr>
            <td>Age:</td>
            <td><input type="text" id="txtAge" onblur="fun5()"></td>
            <td><div id="ErrorAge"></div></td>
        </tr>

        <tr>
            <td>Email:</td>
            <td><input type="text" id="txtEmail" onblur="fun6()"></td>
            <td><div id="ErrorEmail"></div></td>
        </tr>

        <tr>
            <td>Password:</td>
            <td><input type="password" id="txtPassword" onblur="fun7()"></td>
            <td><div id="ErrorPass"></div></td>
        </tr>

        <tr>
            <td>Emp Id:</td>
            <td><input type="text" id="txtEid" onblur="fun4()"></td>
            <td><div id="ErrorEno"></div></td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </td>
        </tr>

    </table>
</form>

</body>
</html>
